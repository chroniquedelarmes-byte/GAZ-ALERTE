<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#12151c;
  --panel:#1a2029;
  --panel-2:#212836;
  --border:#2a3140;
  --text:#ecece6;
  --muted:#8d94a6;
  --green:#37c77f;
  --green-dim:#1f4d38;
  --red:#ff5c5c;
  --red-dim:#4d2226;
  --orange:#ffa630;
  --grey:#4b5164;
  --display: 'Oswald', sans-serif;
  --body: 'IBM Plex Sans', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);}
body{-webkit-font-smoothing:antialiased;}
.app{max-width:520px;margin:0 auto;padding:18px 14px 40px;background:var(--bg);min-height:100%;position:relative;}

.config-warning{background:var(--red-dim);border:1px solid var(--red);color:var(--red);font-family:var(--mono);font-size:12px;line-height:1.6;padding:14px;border-radius:8px;margin-bottom:16px;display:none;}
.config-warning code{background:#00000040;padding:1px 5px;border-radius:4px;}

.toast{position:sticky;top:8px;z-index:40;background:var(--green-dim);border:1px solid var(--green);color:var(--green);font-family:var(--mono);font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:10px;display:none;cursor:pointer;}

.header{text-align:center;padding:6px 0 14px;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--orange);text-transform:uppercase;margin:0 0 4px;}
.title{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;color:var(--text);}
.title span{color:var(--orange);}
.subtitle{font-family:var(--body);font-size:13px;color:var(--muted);margin:6px 0 0;}

.gauge-wrap{display:flex;flex-direction:column;align-items:center;margin:18px 0 6px;}
.gauge-readout{font-family:var(--mono);font-size:34px;font-weight:600;margin-top:-38px;color:var(--text);}
.gauge-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:2px;}
.gauge-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;text-align:center;}

.loc-row{display:flex;justify-content:center;margin-top:10px;}
.loc-btn{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:20px;cursor:pointer;}
.loc-btn.active{border-color:var(--orange);color:var(--orange);}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0 14px;padding-bottom:2px;}
.tab{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:9px 13px;border-radius:7px;cursor:pointer;white-space:nowrap;flex:0 0 auto;transition:all .15s;}
.tab:hover{border-color:var(--orange);color:var(--text);}
.tab.active{background:var(--orange);color:#1a1206;border-color:var(--orange);font-weight:600;}

.panel-title{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;gap:8px;}
.panel-title h2{font-family:var(--display);font-size:16px;letter-spacing:.03em;margin:0;text-transform:uppercase;color:var(--text);}
.live-dot{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--muted);}
.live-dot i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}

.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filters select{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:13px;padding:9px 8px;border-radius:7px;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:10px;}
.card.flagged{border-color:var(--red);opacity:.7;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.vendor-name{font-family:var(--body);font-weight:600;font-size:14.5px;color:var(--text);margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.habitual-tag{font-family:var(--mono);font-size:9px;background:var(--panel-2);color:var(--orange);border:1px solid var(--border);padding:2px 6px;border-radius:10px;text-transform:uppercase;}
.commune-line{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px;}
.badge{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.badge.dispo{background:var(--green-dim);color:var(--green);}
.badge.rupture{background:var(--red-dim);color:var(--red);}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-wrap:wrap;gap:6px;}
.card-meta a{color:var(--orange);text-decoration:none;}
.price{color:var(--orange);font-weight:600;}
.stale-tag{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--grey);border:1px dashed var(--border);padding:2px 7px;border-radius:5px;}
.flag-tag{display:inline-block;margin-top:8px;margin-left:6px;font-family:var(--mono);font-size:10px;color:var(--red);border:1px dashed var(--red);padding:2px 7px;border-radius:5px;}

.trust-row{display:flex;gap:8px;margin-top:10px;}
.trust-btn{flex:1;font-family:var(--mono);font-size:10.5px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);padding:7px 6px;border-radius:6px;cursor:pointer;text-align:center;}
.trust-btn.confirm:hover{border-color:var(--green);color:var(--green);}
.trust-btn.dispute:hover{border-color:var(--red);color:var(--red);}
.trust-btn:disabled{opacity:.4;cursor:default;}

.empty{text-align:center;color:var(--muted);font-family:var(--body);font-size:13px;padding:30px 10px;border:1px dashed var(--border);border-radius:10px;}

.map-toggle{display:flex;gap:6px;margin-bottom:12px;}
.map-toggle button{flex:1;font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:8px;border-radius:6px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;}
.map-toggle button.active{border-color:var(--orange);color:var(--orange);}
.map-note{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:-4px 0 14px;}
.map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.tile{aspect-ratio:1.15;border-radius:9px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px;text-align:center;transition:transform .1s;position:relative;}
.tile:active{transform:scale(.96);}
.tile-name{font-family:var(--body);font-weight:600;font-size:11px;color:var(--text);line-height:1.15;}
.tile-status{font-family:var(--mono);font-size:9px;margin-top:3px;letter-spacing:.04em;text-transform:uppercase;}
.tile.dispo{background:var(--green-dim);border-color:var(--green);}
.tile.dispo .tile-status{color:var(--green);}
.tile.rupture{background:var(--red-dim);border-color:var(--red);}
.tile.rupture .tile-status{color:var(--red);}
.tile.nodata{background:var(--panel);}
.tile.nodata .tile-status{color:var(--grey);}
.watch-star{position:absolute;top:4px;right:5px;font-size:11px;color:var(--orange);}
.legend{display:flex;gap:14px;justify-content:center;margin-top:14px;font-family:var(--mono);font-size:10.5px;color:var(--muted);flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.g{background:var(--green);} .dot.r{background:var(--red);} .dot.n{background:var(--grey);}

.precise-map-wrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;}
.precise-empty{text-align:center;color:var(--muted);font-family:var(--body);font-size:12.5px;padding:20px;}

.commune-detail{margin-top:16px;}
.commune-detail-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;}
.watch-btn{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:16px;cursor:pointer;}
.watch-btn.active{border-color:var(--orange);color:var(--orange);}

.feed-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.feed-item:last-child{border-bottom:none;}
.feed-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto;}
.feed-dot.g{background:var(--green);} .feed-dot.r{background:var(--red);}
.feed-text{font-family:var(--body);font-size:13px;color:var(--text);line-height:1.4;}
.feed-text b{font-weight:600;}
.feed-time{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;}
.watchlist-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:14px;}
.watchlist-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
.watchlist-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--border);color:var(--orange);padding:5px 10px;border-radius:16px;}
.chip button{background:none;border:none;color:var(--muted);margin-left:6px;cursor:pointer;font-size:11px;}

.form-group{margin-bottom:13px;}
.form-group label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.form-group input,.form-group select{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:14px;padding:10px 11px;border-radius:7px;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--orange);}
.status-choice{display:flex;gap:8px;}
.status-btn{flex:1;padding:12px 8px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-family:var(--body);font-weight:600;font-size:13.5px;cursor:pointer;text-align:center;transition:all .15s;}
.status-btn.sel-dispo{background:var(--green-dim);border-color:var(--green);color:var(--green);}
.status-btn.sel-rupture{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.geo-btn{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:9px;border-radius:7px;cursor:pointer;margin-bottom:4px;}
.geo-btn.ok{border-color:var(--green);color:var(--green);}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;margin-right:8px;border:2px solid var(--green);flex-shrink:0;}
.submit-btn{width:100%;background:var(--orange);color:#1a1206;border:none;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;padding:13px;border-radius:8px;cursor:pointer;margin-top:6px;}
.submit-btn:disabled{opacity:.5;cursor:default;}
.form-msg{font-family:var(--mono);font-size:11.5px;text-align:center;margin-top:10px;color:var(--green);}
.form-note{font-family:var(--mono);font-size:10px;color:var(--grey);text-align:center;margin-top:14px;line-height:1.5;}
.vendor-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:14px;}
.vendor-bar-name{font-family:var(--body);font-weight:600;font-size:13px;color:var(--text);}
.vendor-bar-phone{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;}
.link-btn{background:none;border:none;color:var(--orange);font-family:var(--mono);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0;text-align:center;width:100%;margin-top:10px;}
.pending-note{font-family:var(--mono);font-size:11px;color:var(--orange);background:var(--panel-2);border:1px dashed var(--orange);border-radius:8px;padding:10px;text-align:center;margin-top:10px;line-height:1.5;}
.app-footer{text-align:center;font-family:var(--mono);font-size:10px;color:var(--grey);margin-top:28px;padding-top:14px;border-top:1px solid var(--border);}
.about-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-top:10px;text-align:left;}
.about-box p{font-family:var(--body);font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 8px;}
.about-box p:last-child{margin-bottom:0;}
.about-copyright{font-family:var(--mono) !important;font-size:10px !important;color:var(--grey) !important;}

.sos-btn{display:block;width:100%;max-width:280px;margin:14px auto 0;background:var(--red);color:#fff;border:none;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:13px;border-radius:10px;cursor:pointer;box-shadow:0 0 0 3px var(--red-dim);}
.sos-btn:active{transform:scale(.98);}
.sos-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:none;align-items:flex-end;justify-content:center;}
.sos-overlay.open{display:flex;}
.sos-sheet{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;max-width:520px;width:100%;padding:20px 18px 26px;}
.sos-sheet h3{font-family:var(--display);font-size:17px;margin:0 0 4px;color:var(--red);text-transform:uppercase;}
.sos-sheet p{font-family:var(--body);font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
.sos-option{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:14.5px;font-weight:600;padding:14px 14px;border-radius:10px;cursor:pointer;margin-bottom:10px;text-align:left;text-decoration:none;}
.sos-option .ic{font-size:22px;}
.sos-option .num{margin-left:auto;font-family:var(--mono);color:var(--orange);font-size:13px;}
.sos-option.pompiers{border-color:var(--red);}
.sos-option.police{border-color:var(--orange);}
.sos-option.samu{border-color:var(--green);}
.sos-cancel{width:100%;background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:12px;padding:11px;border-radius:8px;cursor:pointer;margin-top:4px;}
.sos-divider{height:1px;background:var(--border);margin:16px 0;}
.sos-manage-btn{width:100%;background:var(--panel-2);border:1px dashed var(--border);color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px;}
.contact-alert-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--green-dim);border:1px solid var(--green);color:var(--green);font-family:var(--body);font-size:14px;font-weight:600;padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:8px;text-align:left;}
.contact-alert-btn:disabled{opacity:.5;cursor:default;}
.contact-alert-btn .ic{font-size:18px;}
.contact-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-family:var(--body);font-size:13px;}
.contact-row .rm{background:none;border:none;color:var(--red);font-family:var(--mono);font-size:11px;cursor:pointer;}
.no-contacts{font-family:var(--body);font-size:12.5px;color:var(--muted);text-align:center;padding:10px;border:1px dashed var(--border);border-radius:8px;margin-bottom:10px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

/* ---------- Vraie carte (Leaflet) ---------- */
.precise-map-wrap{padding:0;overflow:hidden;}
#preciseMapEl{width:100%;height:360px;background:#e5e3df;}
.leaflet-container{background:#e5e3df;font-family:var(--body);}
.leaflet-control-attribution{background:rgba(255,255,255,.85) !important;color:#555 !important;font-size:9.5px !important;}
.leaflet-control-attribution a{color:#555 !important;}
.leaflet-control-zoom a{background:#fff !important;color:#333 !important;border-color:#ccc !important;}
.leaflet-control-zoom a:hover{background:#f0f0f0 !important;}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;}
.leaflet-popup-content{font-family:var(--body);font-size:12.5px;margin:9px 11px;}
.leaflet-popup-tip{background:var(--panel);}
.map-pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #12151c;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.map-pin.dispo{background:var(--green);}
.map-pin.rupture{background:var(--red);}
.map-pin span{transform:rotate(45deg);font-size:11px;}
.user-pin{width:16px;height:16px;border-radius:50%;background:var(--orange);border:2px solid #12151c;box-shadow:0 0 0 5px rgba(255,166,48,.28);}

.route-btn{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--orange);color:#1a1206 !important;padding:6px 11px;border-radius:16px;text-decoration:none !important;white-space:nowrap;border:none;cursor:pointer;}
.route-info{background:var(--panel);border:1px solid var(--orange);border-radius:10px;padding:11px 13px;margin-bottom:10px;font-family:var(--body);font-size:13px;color:var(--text);line-height:1.5;}
.route-info b{color:var(--orange);}
.route-info .route-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;}
.route-info .mini-btn{margin-top:8px;}
.route-info .route-next{font-weight:600;font-size:14px;margin-top:8px;color:var(--text);}
.route-info .admin-actions{margin-top:8px;}

/* ---------- QR code ---------- */
.qr-card{background:#fff;color:#12151c;border-radius:14px;padding:18px 16px 16px;text-align:center;max-width:300px;margin:0 auto 14px;}
.qr-card .qr-brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;color:#12151c;margin:0;}
.qr-card .qr-brand span{color:#e88a00;}
.qr-card .qr-shop{font-family:var(--body);font-weight:600;font-size:14px;margin:4px 0 0;color:#12151c;word-break:break-word;}
.qr-card .qr-img{margin:12px auto 8px;width:220px;height:220px;}
.qr-card .qr-img svg{width:100%;height:100%;display:block;}
.qr-card .qr-slogan{font-family:var(--body);font-weight:600;font-size:13px;margin:6px 0 2px;color:#12151c;}
.qr-card .qr-sub{font-family:var(--mono);font-size:10px;color:#555;margin:0;letter-spacing:.04em;}
.qr-url{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;word-break:break-all;margin:0 0 12px;}
.qr-warn{font-family:var(--mono);font-size:11px;color:var(--orange);background:var(--panel-2);border:1px dashed var(--orange);border-radius:8px;padding:9px;text-align:center;margin-bottom:12px;line-height:1.5;display:none;}
.sheet-btn{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:11px;border-radius:8px;cursor:pointer;margin-bottom:8px;}
.sheet-btn.primary{background:var(--orange);color:#1a1206;border-color:var(--orange);font-weight:600;}
.qr-open-btn{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--border);color:var(--orange);padding:7px 12px;border-radius:20px;cursor:pointer;}

/* ---------- Espace administrateur ---------- */
.admin-overlay{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;overflow-y:auto;}
.admin-overlay.open{display:block;}
.admin-wrap{max-width:520px;margin:0 auto;padding:18px 14px 50px;}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;}
.admin-head h2{font-family:var(--display);font-size:20px;margin:0;color:var(--orange);text-transform:uppercase;}
.admin-sec{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.admin-row{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;}
.admin-row b{font-family:var(--body);font-size:13.5px;}
.admin-row .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.admin-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.mini-btn{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer;}
.mini-btn.ok{border-color:var(--green);color:var(--green);}
.mini-btn.no{border-color:var(--orange);color:var(--orange);}
.mini-btn.del{border-color:var(--red);color:var(--red);}
.mini-btn.danger-all{background:var(--red-dim);}
.pill{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;padding:2px 7px;border-radius:10px;margin-left:6px;}
.pill.pending{background:var(--panel-2);color:var(--orange);border:1px solid var(--orange);}
.pill.approved{background:var(--green-dim);color:var(--green);}
.pill.rejected{background:var(--red-dim);color:var(--red);}
.admin-link{background:none;border:none;color:var(--grey);font-family:var(--mono);font-size:10px;text-decoration:underline;cursor:pointer;margin-top:8px;}

@media print{
  body *{visibility:hidden !important;}
  #printArea, #printArea *{visibility:visible !important;}
  #printArea{position:absolute;left:0;top:0;width:100%;display:block !important;}
  #printArea .qr-card{margin:20mm auto;border:2px solid #000;max-width:90mm;}
}
</style>
<script defer src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, getDoc, deleteDoc, writeBatch, getDocs,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCP4ZpM0RIyUm5wHrkRjCVc2AB7Wd0eoV8",
  authDomain: "gaz-alerte.firebaseapp.com",
  projectId: "gaz-alerte",
  storageBucket: "gaz-alerte.firebasestorage.app",
  messagingSenderId: "247054671233",
  appId: "1:247054671233:web:0ab068fa8f45748f1a9c80"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const reportsCol = collection(db, "reports");

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
function timeAgo(ts){
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if(min < 1) return "à l'instant";
  if(min < 60) return `il y a ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24) return `il y a ${h} h`;
  const d = Math.floor(h/24);
  return `il y a ${d} j`;
}

/* ---------- Espace administrateur (Firebase Authentication) ---------- */
let auth = null;
let adminUnsubVendors = null, adminUnsubReports = null;
let ADMIN_VENDORS = [], ADMIN_REPORTS = [];

function adminMsg(text, ok){
  const el = document.getElementById('adminMsg');
  el.style.color = ok ? '#37c77f' : '#ff5c5c';
  el.textContent = text;
}

function renderAdminVendors(){
  document.getElementById('adminVendorsTitle').textContent = `Comptes vendeurs (${ADMIN_VENDORS.length})`;
  const box = document.getElementById('adminVendors');
  if(ADMIN_VENDORS.length === 0){ box.innerHTML = '<div class="empty">Aucun compte vendeur.</div>'; return; }
  const label = { pending:'En attente', approved:'Approuvé', rejected:'Refusé' };
  box.innerHTML = ADMIN_VENDORS.map(v=>`
    <div class="admin-row">
      <b>${escapeHtml(v.name || v.phone)}</b><span class="pill ${escapeAttr(v.status || 'pending')}">${label[v.status] || escapeHtml(v.status || '')}</span>
      <div class="meta">📞 ${escapeHtml(v.phone || v.id)}</div>
      <div id="ph_${escapeAttr(v.id)}" style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;"></div>
      <div class="admin-actions">
        <button class="mini-btn" data-act="photos" data-id="${escapeAttr(v.id)}">📷 Voir les photos</button>
        ${v.status !== 'approved' ? `<button class="mini-btn ok" data-act="approve" data-id="${escapeAttr(v.id)}">✓ Approuver</button>` : ''}
        ${v.status !== 'rejected' ? `<button class="mini-btn no" data-act="reject" data-id="${escapeAttr(v.id)}">Refuser</button>` : ''}
        <button class="mini-btn del" data-act="delVendor" data-id="${escapeAttr(v.id)}">Supprimer le compte</button>
        <button class="mini-btn del" data-act="delVendorAll" data-id="${escapeAttr(v.id)}">Supprimer compte + signalements</button>
      </div>
    </div>`).join('');
}

function renderAdminReports(){
  document.getElementById('adminReportsTitle').textContent = `Signalements (${ADMIN_REPORTS.length})`;
  const box = document.getElementById('adminReports');
  if(ADMIN_REPORTS.length === 0){ box.innerHTML = '<div class="empty">Aucun signalement.</div>'; return; }
  box.innerHTML = ADMIN_REPORTS.slice(0,200).map(r=>`
    <div class="admin-row">
      <b>${escapeHtml(r.vendorName || '')}</b> <span class="pill ${r.status === 'dispo' ? 'approved' : 'rejected'}">${r.status === 'dispo' ? 'Disponible' : 'Rupture'}</span>
      <div class="meta">${escapeHtml(r.commune || '')} · ${escapeHtml(r.phone || '')} · ${timeAgo(r.timestamp || 0)}</div>
      <div class="admin-actions">
        <button class="mini-btn del" data-act="delReport" data-id="${escapeAttr(r.id)}">Supprimer</button>
      </div>
    </div>`).join('');
}

async function deleteMany(refs){
  // Suppression par lots (limite Firestore : 500 opérations par lot)
  for(let i = 0; i < refs.length; i += 400){
    const batch = writeBatch(db);
    refs.slice(i, i + 400).forEach(r => batch.delete(r));
    await batch.commit();
  }
}

async function adminHandleAction(act, id){
  try{
    if(act === 'approve' || act === 'reject'){
      await updateDoc(doc(db, 'vendors', id), { status: act === 'approve' ? 'approved' : 'rejected' });
      adminMsg(act === 'approve' ? 'Compte approuvé.' : 'Compte refusé.', true);
    }else if(act === 'delVendor'){
      if(!confirm('Supprimer ce compte vendeur ?')) return;
      await deleteDoc(doc(db, 'vendors', id));
      adminMsg('Compte supprimé.', true);
    }else if(act === 'delVendorAll'){
      if(!confirm('Supprimer ce compte ET tous ses signalements ?')) return;
      const refs = ADMIN_REPORTS.filter(r => r.phone === id).map(r => doc(db, 'reports', r.id));
      refs.push(doc(db, 'vendors', id));
      await deleteMany(refs);
      adminMsg('Compte et signalements supprimés.', true);
    }else if(act === 'delReport'){
      if(!confirm('Supprimer ce signalement ?')) return;
      await deleteDoc(doc(db, 'reports', id));
      adminMsg('Signalement supprimé.', true);
    }
  }catch(e){
    adminMsg('Échec : ' + e.message, false);
  }
}

function startAdminListeners(){
  stopAdminListeners();
  adminUnsubVendors = onSnapshot(collection(db, 'vendors'), (snap)=>{
    ADMIN_VENDORS = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b)=> (b.createdAt || 0) - (a.createdAt || 0));
    renderAdminVendors();
  }, (e)=> adminMsg('Lecture des vendeurs refusée : ' + e.message + ' (règles Firestore ?)', false));
  adminUnsubReports = onSnapshot(query(reportsCol, orderBy('timestamp','desc')), (snap)=>{
    ADMIN_REPORTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAdminReports();
  }, (e)=> adminMsg('Lecture des signalements refusée : ' + e.message, false));
}
function stopAdminListeners(){
  if(adminUnsubVendors){ adminUnsubVendors(); adminUnsubVendors = null; }
  if(adminUnsubReports){ adminUnsubReports(); adminUnsubReports = null; }
  ADMIN_VENDORS = []; ADMIN_REPORTS = [];
}

function setupAdmin(){
  const overlay = document.getElementById('adminOverlay');
  const loginBox = document.getElementById('adminLoginBox');
  const panel = document.getElementById('adminPanel');

  document.getElementById('adminOpenBtn').addEventListener('click', ()=> overlay.classList.add('open'));
  document.getElementById('adminClose').addEventListener('click', ()=> overlay.classList.remove('open'));

  if(!app){ return; }
  auth = getAuth(app);

  onAuthStateChanged(auth, (user)=>{
    if(user){
      loginBox.style.display = 'none';
      panel.style.display = 'block';
      document.getElementById('adminWho').textContent = user.email || '';
      startAdminListeners();
    }else{
      stopAdminListeners();
      panel.style.display = 'none';
      loginBox.style.display = 'block';
    }
  });

  document.getElementById('adminLoginBtn').addEventListener('click', async ()=>{
    const msg = document.getElementById('adminLoginMsg');
    const email = document.getElementById('adm_email').value.trim();
    const pass = document.getElementById('adm_pass').value;
    if(!email || !pass){ msg.style.color = '#ff5c5c'; msg.textContent = 'Entrez votre e-mail et votre mot de passe.'; return; }
    msg.style.color = '#8d94a6'; msg.textContent = 'Connexion…';
    try{
      await signInWithEmailAndPassword(auth, email, pass);
      msg.textContent = '';
      document.getElementById('adm_pass').value = '';
    }catch(e){
      msg.style.color = '#ff5c5c';
      msg.textContent = 'Connexion refusée : e-mail ou mot de passe incorrect.';
    }
  });

  document.getElementById('adminLogoutBtn').addEventListener('click', ()=> signOut(auth));

  panel.addEventListener('click', (e)=>{
    const b = e.target.closest('button[data-act]');
    if(b) adminHandleAction(b.dataset.act, b.dataset.id);
  });

  document.getElementById('adminDelAllVendors').addEventListener('click', async ()=>{
    if(!confirm('Supprimer TOUS les comptes vendeurs ? Cette action est définitive.')) return;
    if(!confirm('Dernière confirmation : supprimer tous les vendeurs ?')) return;
    try{
      await deleteMany(ADMIN_VENDORS.map(v => doc(db, 'vendors', v.id)));
      adminMsg('Tous les comptes vendeurs ont été supprimés.', true);
    }catch(e){ adminMsg('Échec : ' + e.message, false); }
  });

  document.getElementById('adminDelAllReports').addEventListener('click', async ()=>{
    if(!confirm('Supprimer TOUS les signalements ? Cette action est définitive.')) return;
    if(!confirm('Dernière confirmation : supprimer tous les signalements ?')) return;
    try{
      const snap = await getDocs(reportsCol);
      await deleteMany(snap.docs.map(d => d.ref));
      adminMsg('Tous les signalements ont été supprimés.', true);
    }catch(e){ adminMsg('Échec : ' + e.message, false); }
  });
}


setupAdmin();
  document.getElementById('adminVendors').addEventListener('click', async (e)=>{
    const b = e.target.closest('[data-act="photos"]'); if(!b) return;
    const slot = document.getElementById('ph_' + b.dataset.id);
    if(slot.childElementCount || slot.textContent){ slot.textContent = ''; return; }
    slot.textContent = 'Chargement…';
    try{
      const snap = await getDoc(doc(db, 'vendorPhotos', b.dataset.id));
      slot.textContent = '';
      if(!snap.exists()){ slot.textContent = 'Aucune photo.'; return; }
      const d = snap.data();
      [['Vendeur', d.face], ['Boutique', d.shop]].forEach(([label, src])=>{
        if(typeof src !== 'string' || !src.startsWith('data:image/')) return;
        const img = document.createElement('img');
        img.src = src; img.alt = label; img.title = label;
        img.style.cssText = 'width:46%;max-width:220px;border-radius:8px;border:1px solid var(--border);';
        slot.appendChild(img);
      });
    }catch(err){ slot.textContent = 'Erreur : ' + err.message; }
  });
</script>
</body>
</html>
